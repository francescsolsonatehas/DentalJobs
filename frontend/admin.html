<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Verificación de colegiado — DentalJobs</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #f3f4f6; }
        .admin-wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1rem; }
        .admin-token-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .admin-token-row input { flex: 1; }
        table.admin-tabla { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        table.admin-tabla th, table.admin-tabla td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 0.9rem; }
        table.admin-tabla th { background: #0f4c75; color: white; }
        .admin-acciones { display: flex; gap: 0.5rem; }
    </style>
</head>
<body>
    <div class="admin-wrap">
        <h1 style="color: #0f4c75;">🔐 Verificación de nº de colegiado</h1>
        <p style="color: #6b7280;">Página interna, no enlazada desde la web pública. Requiere el token de administración configurado en el servidor (variable <code>ADMIN_TOKEN</code>).</p>

        <div class="admin-token-row">
            <input type="password" id="adminToken" placeholder="Pega aquí el ADMIN_TOKEN">
            <button class="btn-primary" onclick="cargarPendientes()">Cargar pendientes</button>
        </div>

        <div id="adminMensaje" style="margin-bottom: 1rem;"></div>
        <div id="adminContenido"></div>
    </div>

    <script src="config.js"></script>
    <script>
        const API_ADMIN = window.API_URL || "";

        function tokenGuardado() {
            return sessionStorage.getItem("adminToken") || "";
        }

        document.getElementById("adminToken").value = tokenGuardado();

        function escapeHtml(texto) {
            if (texto === null || texto === undefined) return "";
            return String(texto)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function mostrarMensaje(texto, tipo) {
            const el = document.getElementById("adminMensaje");
            const color = tipo === "error" ? "#ef4444" : "#10b981";
            el.innerHTML = `<p style="color: ${color}; font-weight: 600;">${escapeHtml(texto)}</p>`;
        }

        async function cargarPendientes() {
            const token = document.getElementById("adminToken").value.trim();
            if (!token) {
                mostrarMensaje("Introduce el ADMIN_TOKEN", "error");
                return;
            }
            sessionStorage.setItem("adminToken", token);

            try {
                const res = await fetch(`${API_ADMIN}/admin/verificaciones-pendientes`, {
                    headers: { "X-Admin-Token": token }
                });
                const data = await res.json();
                if (!res.ok) {
                    mostrarMensaje(data.error || "Error al cargar", "error");
                    document.getElementById("adminContenido").innerHTML = "";
                    return;
                }

                mostrarMensaje("", "");
                renderTabla(data.pendientes || []);
            } catch (error) {
                mostrarMensaje("No se pudo conectar con el servidor: " + error.message, "error");
            }
        }

        function renderTabla(pendientes) {
            const contenedor = document.getElementById("adminContenido");
            if (pendientes.length === 0) {
                contenedor.innerHTML = `<p style="color: #6b7280;">No hay verificaciones pendientes ahora mismo.</p>`;
                return;
            }

            contenedor.innerHTML = `
                <table class="admin-tabla">
                    <thead>
                        <tr><th>Nombre</th><th>Email</th><th>Nº colegiado</th><th>Colegio</th><th>Acciones</th></tr>
                    </thead>
                    <tbody>
                        ${pendientes.map(p => `
                            <tr>
                                <td>${escapeHtml(p.nombre)}</td>
                                <td>${escapeHtml(p.email)}</td>
                                <td>${escapeHtml(p.num_colegiado)}</td>
                                <td>${escapeHtml(p.colegio)}</td>
                                <td class="admin-acciones">
                                    <button class="btn-primary btn-small" onclick="resolver(${p.id}, 'verificado')">✓ Verificar</button>
                                    <button class="btn-outline btn-small" onclick="resolver(${p.id}, 'rechazado')">✗ Rechazar</button>
                                </td>
                            </tr>
                        `).join("")}
                    </tbody>
                </table>
            `;
        }

        async function resolver(usuarioId, estado) {
            const token = tokenGuardado();
            try {
                const res = await fetch(`${API_ADMIN}/admin/verificaciones/${usuarioId}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "X-Admin-Token": token },
                    body: JSON.stringify({ estado })
                });
                const data = await res.json();
                if (!res.ok) {
                    mostrarMensaje(data.error || "Error al actualizar", "error");
                    return;
                }
                mostrarMensaje(data.mensaje || "Actualizado", "ok");
                cargarPendientes();
            } catch (error) {
                mostrarMensaje("Error al conectar: " + error.message, "error");
            }
        }
    </script>
</body>
</html>
