# Sincroniza la carpeta frontend/ al repositorio público espejo (dentaljobs-web),
# desde el que se sirve GitHub Pages. El repo principal permanece privado.
#
# Requiere el secret GH_SYNC_TOKEN: un fine-grained PAT con permiso
# "Contents: read and write" sobre el repo dentaljobs-web.
name: Espejo del frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/espejo-frontend.yml"
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar frontend en el repo espejo
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          cd frontend
          # Cache-busting: cada deploy sirve app.js y style.css con una versión única
          # (el SHA corto del commit), para que los navegadores no reutilicen una copia
          # antigua en caché. Solo se aplica a la copia del espejo; el index.html del
          # repo fuente queda con las rutas limpias para desarrollo local.
          VER="${GITHUB_SHA::7}"
          sed -i "s/app\.js\"/app.js?v=${VER}\"/g; s/style\.css\"/style.css?v=${VER}\"/g" index.html
          git init -b main
          git config user.name "dentaljobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sincronizar frontend desde el repo principal (${GITHUB_SHA::7})"
          git push --force "https://x-access-token:${GH_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/dentaljobs-web.git" main
